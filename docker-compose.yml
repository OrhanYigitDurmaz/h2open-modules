# Local Odoo 20 Community dev environment for the h2o_* modules.
#
#   docker compose up -d
#   docker compose run --rm odoo odoo -d h2open -i h2o_reporting --stop-after-init
#   open http://localhost:8069  (admin / admin)
#
# This repo is mounted at /mnt/extra-addons, which is already on the image's
# addons path, so code changes only need a restart (or -u <module>).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  odoo:
    image: odoo:20
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    # --http-interface: Odoo 20 binds 127.0.0.1 by default, unreachable via the port map
    command: ["odoo", "--http-interface=0.0.0.0", "--dev=reload,xml"]
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - .:/mnt/extra-addons:ro
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
