name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  odoo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Installs every h2o_* module into a fresh database on the same odoo:20
      # image as docker-compose.yml and runs their tests only (not those of
      # the standard apps they depend on).
      - name: Install modules and run tests
        # The image's entrypoint turns HOST/USER/PASSWORD into --db_* flags
        # (default host "db"), overriding any passed on the command line.
        run: |
          set -o pipefail
          modules=$(ls -d h2o_*/ | tr -d / | paste -sd,)
          tags=$(ls -d h2o_*/ | tr -d / | sed 's|^|/|' | paste -sd,)
          docker run --rm --network host -v "$PWD:/mnt/extra-addons:ro" \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo odoo:20 \
            odoo -d h2open_test -i "$modules" --test-enable --test-tags "$tags" \
            --stop-after-init --log-level=test 2>&1 | tee odoo.log
      # Odoo can exit 0 after a failed test or install step, so also fail on
      # any ERROR or CRITICAL line.
      - name: Check log for errors
        run: |
          if grep -E " (ERROR|CRITICAL) " odoo.log; then exit 1; fi
          grep "tests when loading" odoo.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odoo-test-log
          path: odoo.log

  # Runs the MCP server's tools against a live Odoo with every h2o_* module
  # and its demo data (mcp_server/tests/test_live.py).
  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ODOO: docker run --rm -i --network host -v ${{ github.workspace }}:/mnt/extra-addons:ro -e HOST=localhost -e USER=odoo -e PASSWORD=odoo odoo:20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the MCP server
        run: pip install "./mcp_server[test]"
      - name: Helper tests
        working-directory: mcp_server
        run: pytest -q tests/test_helpers.py
      - name: Install modules with demo data
        run: $ODOO odoo -d h2open_mcp -i h2o_reporting --with-demo --stop-after-init
      - name: Create API keys
        run: |
          set -o pipefail
          $ODOO odoo shell -d h2open_mcp --no-http > keys.txt <<'PY'
          from datetime import timedelta
          from odoo import fields
          for login, name in (('admin', 'H2OPEN_API_KEY'), ('driver', 'H2OPEN_TEST_DRIVER_KEY')):
              user = env['res.users'].search([('login', '=', login)])
              key = user.with_user(user).env['res.users.apikeys']._generate(
                  'rpc', 'CI', fields.Datetime.now() + timedelta(days=1))
              print(f'{name}={key}')
          env.cr.commit()
          PY
          grep -E '^H2OPEN_' keys.txt | while IFS== read -r name key; do
            echo "::add-mask::$key"
            echo "$name=$key" >> "$GITHUB_ENV"
          done
          rm keys.txt
      - name: Start Odoo
        run: |
          docker run -d --name odoo --network host -v "$PWD:/mnt/extra-addons:ro" \
            -e HOST=localhost -e USER=odoo -e PASSWORD=odoo odoo:20 odoo -d h2open_mcp
          for i in $(seq 60); do curl -sf http://localhost:8069/web/health && exit 0; sleep 2; done
          docker logs odoo; exit 1
      - name: Live tests
        working-directory: mcp_server
        env:
          H2OPEN_URL: http://localhost:8069
          H2OPEN_DB: h2open_mcp
        run: |
          test -n "$H2OPEN_API_KEY" -a -n "$H2OPEN_TEST_DRIVER_KEY"
          pytest -q -rs tests/test_live.py
      - name: Odoo log
        if: always()
        run: docker logs odoo 2>&1 | tail -200 || true
