[project]
name = "h2open-mcp"
version = "0.1.0"
description = "MCP server for H2Open dispatchers and managers, on top of the h2o_* Odoo modules"
readme = "README.md"
requires-python = ">=3.12"
license = "LGPL-3.0-only"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
h2open-mcp = "h2open_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
